[project]
name = "ChainAgents"
version = "1.1.0"
description = "Chainlit UI for a LangChain Deep Agent backed by Ollama, OpenAI-compatible servers, or Anthropic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "chainlit>=2.12.0",
    "deepagents==0.7.11",
    "fastapi>=0.135.0",
    "langchain-anthropic>=1.3.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=3.0.0",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-postgres>=1.0.0",
    "markdown-it-py>=4.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "textual>=6.1.0",
    "uvicorn>=0.44.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest>=8.3.0",
    "ruff==0.16.6",
]

[project.scripts]
chainagents = "chainagents.interfaces.cli.app:main"
chainagents-api = "chainagents.interfaces.api.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "agent_commands",
    "agent_stream_events",
    "async_task_notifications",
    "chainagents_api",
    "chainagents_cli",
    "chainagents_tui",
    "chainlit_bridge",
    "chainlit_persistence",
    "deepagent_runtime",
    "langgraph_app",
    "langchain_warning_filters",
    "main",
    "rag_runtime",
    "response_exports",
]

[tool.setuptools.packages.find]
include = ["chainagents*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules install warning filters before importing warning-producing libraries.
"chainagents/interfaces/chainlit/app.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
files = [
    "chainagents/exports/generated_files.py",
    "chainagents/interfaces/api/app.py",
    "chainagents/interfaces/api/security.py",
    "chainagents/interfaces/uploads.py",
    "chainagents/runtime/reflection.py",
]
