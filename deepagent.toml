[model]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
temperature = 0
name = "gpt-oss:20b"
models = ["gpt-oss:20b"]
# Declare ["text", "image"] only for models that accept image content.
modalities = ["text"]

reasoning_effort = "medium"
# Set true to bypass model streaming only for tool-calling requests.
#disable_streaming_for_tool_calls = false

# For LM Studio or another OpenAI-compatible server, switch to:
#[model]
#provider = "openai_compatible"
#base_url = "http://127.0.0.1:1234/v1"
#temperature = 0
#name = "qwen3.6-35b-a3b-mtp"
#reasoning_effort = "medium"
#api_key = "optional"

#[model]
#provider = "anthropic"
#temperature = 1
#name = "claude-sonnet-4-6"
#models = ["claude-sonnet-4-6", "claude-opus-4-8", "claude-haiku-4-5-20251001"]
#reasoning_effort = "medium"
#thinking = "auto"
#base_url = "https://api.anthropic.com"

# Named profiles can override any [model] field. They can be selected from
# Chainlit modes/settings or referenced by [agent].model and subagent model.
#[model.profiles.fast-local]
#name = "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
#temperature = 0.1
#reasoning_effort = "medium"
#modalities = ["text", "image"]
#
#[model.profiles.claude-reviewer]
#provider = "anthropic"
#name = "claude-sonnet-4-6"
#thinking = "auto"
#api_key = ""  # optional when ANTHROPIC_API_KEY or DEEPAGENT_MODEL_API_KEY is set

[langfuse]
# Set true to attach Langfuse's LangChain callback handler to agent runs.
enabled = false

[mcp]
tool_name_prefix = false
stateful = true

[agent]
state = "stateful"
# DeepAgents 0.7 adds recursive delete and command execution tools. ChainAgents
# keeps each tool disabled unless its setting is explicitly enabled.
delete_tool_enabled = false
execute_tool_enabled = false
# Optional profile or raw model name for the main/supervisor agent.
# model = "fast-local"
recursion_limit = 200
memory_namespace = "filesystem"
memory_files = ["/memories/AGENTS.md"]
skills = ["skills"]
mcp_servers = []
# Optional instruction appended to the main agent system prompt.
# Use either custom_instruction or custom_instruction_file, not both.
# custom_instruction = "Always ask clarifying questions before editing files."
custom_instruction_file = "prompts/ui_promots.md"
# Legacy flag retained for compatibility; DeepAgents provides summarization.
summarization_middleware_enabled = true
# Token thresholds tune DeepAgents' built-in summarizer. ChainAgents separately
# restores TodoListMiddleware because DeepAgents 0.7 no longer includes it.
summarization_trigger_tokens = 150000
summarization_keep_tokens = 10000

[agent.reflection]
enabled = false
memory_file = "/memories/AGENTS.md"
max_lesson_chars = 700
tool_failure_mode = "unrecovered"

[rag]
enabled = false
persist_directory = ".rag"
include_globs = ["README.md", "chainlit.md", "prompts/**/*.md", "skills/**/*.md"]
exclude_globs = ["AGENTS.md", "AGENT.md"]
chunk_size = 1200
chunk_overlap = 200
top_k = 4

[rag.embedding]
provider = "ollama"
model = "nomic-embed-text"
base_url = "http://127.0.0.1:11434"

[chainlit]
# Set false to hide model selection in chat settings and Modes.
model_mode_enabled = false
# Set false to disable per-message reasoning overrides from the Modes picker.
reasoning_mode_enabled = true
# Set false to hide streamed reasoning step panels and reasoning task entries.
reasoning_steps_enabled = true
# Set false to hide streamed tool step panels and tool task entries.
tool_steps_enabled = true
# Set false to hide the initial startup status message ("Workspace agent ready...").
startup_status_enabled = true
# Set false to hide generated Chainlit CustomElement panels and remove the render tool.
generative_ui_enabled = true
chronological_ui_enabled = false
commands = [
  { name = "summarize", description = "Apply a prompt template.", target = "prompt", value = "Summarize the input", template = "Summarize this:\n{input}" }
]
starters = [
  { label = "Explain this repo", message = "Explain the architecture of this repository and identify the most important files.", icon = "book-open" },
  { label = "Review current changes", message = "Review the current working tree changes for bugs, regressions, and missing tests." }
]
